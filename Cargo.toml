[package]
name = "durable-ws-client"
version = "5.0.0"
authors = ["Douglas Gray <dbgray01@gmail.com>"]
edition = "2024"

[features]
default = ["rustls-ring"]
# TLS backends. yawc is rustls-only, so the crypto provider is chosen here.
rustls-ring = ["yawc/rustls-ring"]
rustls-aws-lc-rs = ["yawc/rustls-aws-lc-rs"]
# Use zlib-rs for permessage-deflate instead of the default miniz backend.
zlib = ["yawc/zlib"]
# SIMD-accelerated UTF-8 validation inside yawc.
simd = ["yawc/simd"]

[dependencies]
bytes = "1.12"
futures = "0.3"
tokio = { version = "1.53", features = ["net", "sync", "time", "macros", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = "0.7.19"
tower = { version = "0.5", features = ["retry"] }
http = "1.5"
url = "2.5"
yawc = { version = "0.3.4", default-features = false }

[dev-dependencies]
base64 = "0.22"
sha1 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
